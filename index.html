<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Voice Notes</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #ef4444;
      --text: #ffffff;
      --subtext: #a1a1aa;
      --border: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .recordings-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .recording-card {
      background-color: var(--card);
      padding: 14px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .recording-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--subtext);
    }

    audio {
      width: 100%;
      height: 36px;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }

    .action-btn {
      background-color: #27272a;
      color: #e4e4e7;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .action-btn:active {
      opacity: 0.8;
    }

    .delete-btn {
      color: #f87171;
    }

    .controls {
      flex-shrink: 0;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 16px));
      background-color: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .timer {
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums;
      color: var(--subtext);
    }

    .record-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 3px solid #3f3f46;
      background-color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .record-btn.recording {
      border-color: #ef4444;
      background-color: transparent;
    }

    .record-btn.recording .inner-icon {
      width: 20px;
      height: 20px;
      background-color: var(--primary);
      border-radius: 4px;
    }

    .inner-icon {
      width: 24px;
      height: 24px;
      background-color: white;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .empty-state {
      text-align: center;
      color: var(--subtext);
      margin-top: 40px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>Voice Notes</header>

  <main class="recordings-list" id="recordingsList">
    <div class="empty-state" id="emptyState">No notes yet. Tap the red button to record.</div>
  </main>

  <div class="controls">
    <div class="timer" id="timer">00:00</div>
    <button class="record-btn" id="recordBtn" aria-label="Record">
      <div class="inner-icon"></div>
    </button>
  </div>

  <script>
    // --- DATABASE SETUP (IndexedDB) ---
    let db;
    const request = indexedDB.open('VoiceNotesDB', 1);

    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('notes')) {
        db.createObjectStore('notes', { keyPath: 'id', autoIncrement: true });
      }
    };

    request.onsuccess = (e) => {
      db = e.target.result;
      loadSavedNotes();
    };

    request.onerror = (e) => {
      console.error("Database error: ", e);
    };

    // --- APP LOGIC ---
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let timerInterval;
    let secondsElapsed = 0;

    const recordBtn = document.getElementById('recordBtn');
    const timerDisplay = document.getElementById('timer');
    const recordingsList = document.getElementById('recordingsList');
    const emptyState = document.getElementById('emptyState');

    function formatTime(sec) {
      const mins = Math.floor(sec / 60).toString().padStart(2, '0');
      const secs = (sec % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    async function toggleRecording() {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          const mimeType = MediaRecorder.isTypeSupported('audio/mp4') 
            ? 'audio/mp4' 
            : 'audio/webm';

          mediaRecorder = new MediaRecorder(stream, { mimeType });
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunks.push(event.data);
          };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            saveNoteToDB(audioBlob, mimeType);
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.classList.add('recording');
          
          secondsElapsed = 0;
          timerDisplay.textContent = "00:00";
          timerInterval = setInterval(() => {
            secondsElapsed++;
            timerDisplay.textContent = formatTime(secondsElapsed);
          }, 1000);

        } catch (err) {
          alert("Microphone access denied or unavailable.");
          console.error(err);
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.classList.remove('recording');
        clearInterval(timerInterval);
        timerDisplay.textContent = "00:00";
      }
    }

    function saveNoteToDB(blob, mimeType) {
      const now = new Date();
      const noteItem = {
        blob: blob,
        mimeType: mimeType,
        date: now.toLocaleDateString([], { month: 'short', day: 'numeric' }),
        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        timestamp: Date.now()
      };

      const tx = db.transaction(['notes'], 'readwrite');
      const store = tx.objectStore('notes');
      const addRequest = store.add(noteItem);

      addRequest.onsuccess = (e) => {
        noteItem.id = e.target.result;
        renderCard(noteItem, true);
      };
    }

    function loadSavedNotes() {
      const tx = db.transaction(['notes'], 'readonly');
      const store = tx.objectStore('notes');
      const getAllRequest = store.getAll();

      getAllRequest.onsuccess = (e) => {
        const notes = e.target.result;
        if (notes.length > 0) {
          emptyState.style.display = 'none';
          notes.sort((a, b) => a.timestamp - b.timestamp);
          notes.forEach(note => renderCard(note, false));
        }
      };
    }

    function deleteNote(id, cardElement) {
      const tx = db.transaction(['notes'], 'readwrite');
      const store = tx.objectStore('notes');
      store.delete(id);

      tx.oncomplete = () => {
        cardElement.remove();
        if (recordingsList.querySelectorAll('.recording-card').length === 0) {
          emptyState.style.display = 'block';
        }
      };
    }

    async function shareOrDownloadNote(blob, filename) {
      const file = new File([blob], filename, { type: blob.type });

      // Try phone native share sheet first (iOS/Android "Save to Files")
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: filename,
          });
          return;
        } catch (err) {
          if (err.name !== 'AbortError') console.error(err);
        }
      }

      // Fallback for browsers that don't support file sharing
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function renderCard(note, prepend = false) {
      emptyState.style.display = 'none';

      const audioUrl = URL.createObjectURL(note.blob);
      const ext = note.mimeType.includes('mp4') ? 'mp4' : 'webm';
      const fileName = `VoiceNote-${note.timestamp}.${ext}`;

      const card = document.createElement('div');
      card.className = 'recording-card';
      card.innerHTML = `
        <div class="recording-header">
          <strong>${note.date}</strong>
          <span>${note.time}</span>
        </div>
        <audio controls src="${audioUrl}" playsinline></audio>
        <div class="card-actions">
          <button class="action-btn delete-btn">Delete</button>
          <button class="action-btn share-btn">Save / Share</button>
        </div>
      `;

      card.querySelector('.delete-btn').addEventListener('click', () => {
        deleteNote(note.id, card);
      });

      card.querySelector('.share-btn').addEventListener('click', () => {
        shareOrDownloadNote(note.blob, fileName);
      });

      if (prepend) {
        recordingsList.prepend(card);
      } else {
        recordingsList.prepend(card);
      }
    }

    recordBtn.addEventListener('click', toggleRecording);
  </script>
</body>
</html>
